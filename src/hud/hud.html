<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
    <title>轻语</title>
    <style>
      :root {
        --fg: #f2f5f9;
        --muted: #9aa6b4;
        --accent: #2dd4bf;
        --danger: #ff6b6b;
        --ok: #4ade80;
        --panel: rgba(18, 22, 29, 0.93);
        --border: rgba(255, 255, 255, 0.09);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }

      #hud {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 18px 0 0;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 999px;
        backdrop-filter: blur(16px) saturate(1.2);
        -webkit-backdrop-filter: blur(16px) saturate(1.2);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.10),
          0 10px 30px -8px rgba(0, 0, 0, 0.55);
        color: var(--fg);
        font-family: "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
        font-size: 13px;
        line-height: 1;
        opacity: 0;
        transform: translateY(8px) scale(0.97);
        transition: opacity 160ms ease, transform 180ms cubic-bezier(0.2, 0.8, 0.2, 1);
        height: 52px;
      }
      #hud.show { opacity: 1; transform: translateY(0) scale(1); }

      /* 左侧：会呼吸的麦克风圆牌 */
      #badge {
        width: 52px; height: 52px;
        border-radius: 999px;
        flex: none;
        display: flex; align-items: center; justify-content: center;
        background: radial-gradient(120% 120% at 32% 24%, #3ee6cf 0%, #17a98f 62%, #0e7a68 100%);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.38),
          inset 0 -2px 4px rgba(0, 0, 0, 0.22),
          0 4px 14px -4px rgba(45, 212, 191, 0.55);
        color: #06231f;
        position: relative;
      }
      #hud[data-stage="idle"] #badge { background: #2b323d; box-shadow: inset 0 1px 0 rgba(255,255,255,0.08); color: #7d8794; }
      #hud[data-stage="error"] #badge { background: radial-gradient(120% 120% at 32% 24%, #ff8f8f 0%, #e14b4b 62%, #b93333 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 4px 14px -4px rgba(225,75,75,0.5); }
      #hud[data-stage="done"] #badge { background: radial-gradient(120% 120% at 32% 24%, #7df2b0 0%, #2fbb6a 62%, #1d8a4a 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 4px 14px -4px rgba(47,187,106,0.5); }

      /* 录音时圆牌外面套一圈扩散的波纹 */
      #badge::after {
        content: "";
        position: absolute;
        inset: -4px;
        border-radius: 999px;
        border: 2px solid var(--accent);
        opacity: 0;
      }
      #hud[data-stage="recording"] #badge::after { animation: ripple 1.5s ease-out infinite; }
      @keyframes ripple {
        0% { opacity: 0.55; transform: scale(0.88); }
        100% { opacity: 0; transform: scale(1.45); }
      }

      /* 中间：状态文字 */
      #body { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
      #label { font-weight: 600; letter-spacing: 0.01em; }
      #detail { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
      #detail:empty { display: none; }

      /* 右侧：实时声波 */
      #wave {
        display: flex; align-items: center; gap: 2px;
        height: 26px; flex: none;
      }
      #wave i {
        display: block;
        width: 2px;
        border-radius: 2px;
        background: var(--accent);
        height: 3px;
        transition: height 70ms linear, background-color 140ms ease;
      }
      #wave i.hot { background: #f0b429; }
      #wave i.clip { background: var(--danger); }
      #hud[data-stage="idle"] #wave i { background: #39414d; }
      #hud[data-stage="error"] #wave i { background: #4a3236; }
      #hud[data-stage="done"] #wave i { background: #2c5a41; }
    </style>
  </head>
  <body>
    <div id="hud" data-stage="idle">
      <div id="badge">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="2" width="6" height="12" rx="3" />
          <path d="M5 11a7 7 0 0 0 14 0" />
          <line x1="12" y1="18" x2="12" y2="22" />
        </svg>
      </div>
      <div id="body">
        <span id="label">轻语</span>
        <span id="detail"></span>
      </div>
      <div id="wave" aria-hidden="true"></div>
    </div>
    <script type="module" src="./hud.js"></script>
  </body>
</html>
