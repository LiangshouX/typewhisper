# 按 tag 发布：推送 v* 标签时构建 Windows 免安装包并挂到 Release 页
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '手动发布时的版本标签（例如 v0.1.0）'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 下载 rcedit（给 exe 换图标用）
        shell: pwsh
        run: |
          $url = 'https://github.com/electron-userland/electron-builder-binaries/releases/download/winCodeSign-2.6.0/winCodeSign-2.6.0.7z'
          Invoke-WebRequest -Uri $url -OutFile (Join-Path $env:RUNNER_TEMP 'winCodeSign.7z')
          7z x (Join-Path $env:RUNNER_TEMP 'winCodeSign.7z') "-o$($env:RUNNER_TEMP)\winCodeSign" -y | Out-Null
          $rcedit = Get-ChildItem "$($env:RUNNER_TEMP)\winCodeSign" -Recurse -Filter 'rcedit-x64.exe' | Select-Object -First 1
          if (-not $rcedit) { throw '找不到 rcedit-x64.exe' }
          "RCEDIT_PATH=$($rcedit.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "rcedit: $($rcedit.FullName)"

      - name: 构建免安装绿色包
        run: npm run pack

      - name: 记录产物名
        id: artifact
        shell: pwsh
        run: |
          $zip = Get-ChildItem release -Filter '*.zip' | Select-Object -First 1
          if (-not $zip) { throw '没有生成 zip 包' }
          "name=$($zip.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "size=$([math]::Round($zip.Length/1MB,1)) MB" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "产物：$($zip.Name)  $([math]::Round($zip.Length/1MB,1)) MB"

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
          body: |
            ## 轻语 QingYu ${{ github.event.inputs.tag || github.ref_name }}

            Windows 全局语音输入工具：按住快捷键，在任何光标位置说话，识别结果直接插进去。

            **产物**：`${{ steps.artifact.outputs.name }}`（${{ steps.artifact.outputs.size }}）

            解压即用，**不需要安装**：不写注册表、不装服务、不驻留后台。

            > 首次使用请在「设置 → 语音识别」里点「自动检测」，
            > 指向本机的 SenseVoice 模型目录（DSH 已下载的那份可以直接复用）。
